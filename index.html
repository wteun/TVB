<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is het al tijd voor een Bier? 🍺</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <div class="glass-card" id="card">
      <div class="emoji-big" id="mainEmoji">🍺</div>
      <h1 class="title" id="mainTitle">Is het al tijd<br />voor een <span class="highlight">Bier</span>?</h1>
      <div class="answer-wrap" id="answerWrap">
        <p class="answer" id="answerText"></p>
        <p class="reason" id="reasonText"></p>
      </div>
      <div class="clock" id="clock"></div>
      <button class="btn" id="checkBtn">Controleer het nu! 🔍</button>
      <p class="tagline">De meest wetenschappelijk verantwoorde bier-tijdcontroleur ter wereld.</p>
    </div>
  </main>

  <div class="foam-overlay" id="foamOverlay"></div>
  <canvas id="confettiCanvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
